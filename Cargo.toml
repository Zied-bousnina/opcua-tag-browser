[package]
name = "opcua-tag-browser"
version = "0.1.2"
edition = "2021"
authors = ["Zied Bousnina <ziedbousnina39@gmail.com>"]
rust-version = "1.75"
description = "Browse an OPC UA server's address space into a flat, serializable, cacheable tag list."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zied-bousnina/opcua-tag-browser.git"
documentation = "https://docs.rs/opcua-tag-browser"
readme = "README.md"
keywords = ["opcua", "plc", "scada", "industrial", "automation"]
categories = ["network-programming", "embedded"]
exclude = ["/.github", "/pki", "*.json", "/logs"]

[dependencies]
opcua = { version = "0.12", features = ["client"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
serde_json = { version = "1", optional = true }

[features]
default = ["json-cache"]
json-cache = ["dep:serde_json"]

[package.metadata.docs.rs]
all-features = true